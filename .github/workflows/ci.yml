name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `release` is the production-signed configuration and must receive
        # pins from an authorized release environment. CI uses the explicitly
        # labeled optimized unsigned test-release profile instead.
        preset: [debug, release-test, analyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Reject shipped unsigned-authentication bypass
        shell: pwsh
        run: ./verify/check_diagnostic_policy.ps1

      - name: Configure, build, and test in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation plus CMake/Ninja/CTest from PATH or a discovered installation was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          Write-Host "Using VS $($toolchain.InstallationVersion); cmake=$($toolchain.CMakeExe); ninja=$($toolchain.NinjaExe); ctest=$($toolchain.CTestExe)"
          & $toolchain.CMakeExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.NinjaExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No analyze test preset exists, so only debug/release-test run the suite.
          if ('${{ matrix.preset }}' -ne 'analyze') {
            $ctestOutput = @(& $toolchain.CTestExe --preset ${{ matrix.preset }} --output-on-failure 2>&1 | ForEach-Object { $_.ToString() })
            $ctestExit = $LASTEXITCODE
            $ctestOutput | ForEach-Object { Write-Host $_ }
            if ($ctestExit -ne 0) {
              $failedTests = @($ctestOutput | Where-Object { $_ -match '^\s*\d+/\d+\s+Test #\d+:.*Failed|The following tests FAILED' } | ForEach-Object { $_.Trim() })
              $detail = ($failedTests -join ' ')
              if ([string]::IsNullOrWhiteSpace($detail)) { $detail = (($ctestOutput | Select-Object -Last 12) -join ' ') }
              $detail = $detail.Substring(0, [Math]::Min(1200, $detail.Length)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=CTest failure::$detail"
              exit $ctestExit
            }
          }

  asan:
    name: asan-protocol-fuzz
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Reject shipped unsigned-authentication bypass
        shell: pwsh
        run: ./verify/check_diagnostic_policy.ps1

      - name: Configure, build, and run ASAN protocol + IPC framing fuzz in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation plus CMake/Ninja/CTest from PATH or a discovered installation was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          Write-Host "Using VS $($toolchain.InstallationVersion); cmake=$($toolchain.CMakeExe); ninja=$($toolchain.NinjaExe); ctest=$($toolchain.CTestExe)"
          & $toolchain.CMakeExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.NinjaExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --preset asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --build --preset asan --target ffprotocol_fuzz_tests ffipc_framing_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ctestOutput = @(& $toolchain.CTestExe --test-dir build/asan -R "ffprotocol_fuzz_tests|ffipc_framing_tests" --output-on-failure 2>&1 | ForEach-Object { $_.ToString() })
          $ctestExit = $LASTEXITCODE
          $ctestOutput | ForEach-Object { Write-Host $_ }
          if ($ctestExit -ne 0) {
            $diagnosticLines = @($ctestOutput | Where-Object {
              $_ -match 'AddressSanitizer|ERROR:|SUMMARY:|READ of size|WRITE of size|heap-|stack-|use-after|buffer-overflow|^\s*#\d+'
            })
            $detail = if ($diagnosticLines.Count -gt 0) {
              $diagnosticLines -join ' '
            } else {
              ($ctestOutput | Select-Object -Last 12) -join ' '
            }
            $detail = $detail.Substring(0, [Math]::Min(1200, $detail.Length)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest failure::$detail"
            exit $ctestExit
          }

  hygiene:
    name: repository-hygiene-and-contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Source and diagnostic policy
        shell: pwsh
        run: |
          ./verify/check_source_markers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/check_diagnostic_policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: OpenSpec strict validation
        shell: pwsh
        run: npx --yes --package=@fission-ai/openspec@1.8.0 openspec validate --all --strict --no-interactive

      - name: Status and provider contract tests
        shell: pwsh
        run: |
          $statusRoot = Join-Path $env:GITHUB_WORKSPACE 'ci-status'
          ./verify/status/Get-ProjectStatus.ps1 -SkipCtest -OutputDirectory $statusRoot -Format human
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/status/New-ReleaseReadinessReport.ps1 -SkipCtest -OutputDirectory $statusRoot -Format human
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/status/tests/Test-ProjectStatus.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/providers/tests/Test-ProviderContract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact committed-tree qualification
        shell: pwsh
        run: |
          $statusRoot = Join-Path $env:GITHUB_WORKSPACE 'ci-status'
          $qualification = Join-Path $statusRoot 'exact-tree-qualification.json'
          ./verify/qualification/Invoke-ExactTreeQualification.ps1 -OutputPath $qualification -Format human
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/status/Get-ProjectStatus.ps1 -SkipCtest -OutputDirectory $statusRoot -VerificationRunResultPath $qualification -Format human
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify/status/New-ReleaseReadinessReport.ps1 -SkipCtest -OutputDirectory $statusRoot -VerificationRunResultPath $qualification -Format human
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-status-${{ github.run_id }}
          path: ci-status/
          if-no-files-found: ignore
          retention-days: 14

  release-qualification:
    name: unsigned-release-candidate-qualification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure and build release-test
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation plus CMake/Ninja/CTest from PATH or a discovered installation was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          & $toolchain.CMakeExe --preset release-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --build --preset release-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise unsigned candidate packaging, checksums, and provenance
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'Toolchain discovery failed after release-test build.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          ./verify/release/tests/Test-ReleaseCandidate.ps1 -RepoRoot $env:GITHUB_WORKSPACE -BuildRoot (Join-Path $env:GITHUB_WORKSPACE 'build\release-test')

      - name: Upload safe release test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ github.run_id }}
          path: |
            out/release-candidate/**/candidate-manifest.json
            out/release-candidate/**/provenance.json
          if-no-files-found: ignore
          retention-days: 14
