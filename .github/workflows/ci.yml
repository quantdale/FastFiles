name: CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, analyze]
    env:
      # VS2022 Enterprise (windows-latest image) bundled Ninja.
      FASTFILES_NINJA_EXE: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      # No analyze test preset exists, so only debug/release run the suite.
      - name: Test
        if: matrix.preset != 'analyze'
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
