name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `release` is the production-signed configuration and must receive
        # pins from an authorized release environment. CI uses the explicitly
        # labeled optimized unsigned test-release profile instead.
        preset: [debug, release-test, analyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Configure, build, and test in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation plus CMake/Ninja/CTest from PATH or a discovered installation was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          Write-Host "Using VS $($toolchain.InstallationVersion); cmake=$($toolchain.CMakeExe); ninja=$($toolchain.NinjaExe); ctest=$($toolchain.CTestExe)"
          & $toolchain.CMakeExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.NinjaExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No analyze test preset exists, so only debug/release-test run the suite.
          if ('${{ matrix.preset }}' -ne 'analyze') {
            & $toolchain.CTestExe --preset ${{ matrix.preset }} --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  asan:
    name: asan-protocol-fuzz
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Configure, build, and run ASAN protocol fuzz in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation plus CMake/Ninja/CTest from PATH or a discovered installation was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          Write-Host "Using VS $($toolchain.InstallationVersion); cmake=$($toolchain.CMakeExe); ninja=$($toolchain.NinjaExe); ctest=$($toolchain.CTestExe)"
          & $toolchain.CMakeExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.NinjaExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --preset asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CMakeExe --build --preset asan --target ffprotocol_fuzz_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolchain.CTestExe --test-dir build/asan -R ffprotocol_fuzz_tests --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
