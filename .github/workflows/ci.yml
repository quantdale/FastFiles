name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `release` is the production-signed configuration and must receive
        # pins from an authorized release environment. CI uses the explicitly
        # labeled optimized unsigned test-release profile instead.
        preset: [debug, release-test, analyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Configure, build, and test in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation with bundled CMake/Ninja was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          cmake --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No analyze test preset exists, so only debug/release-test run the suite.
          if ('${{ matrix.preset }}' -ne 'analyze') {
            ctest --preset ${{ matrix.preset }} --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  asan:
    name: asan-protocol-fuzz
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject production debug markers
        shell: pwsh
        run: ./verify/check_source_markers.ps1

      - name: Configure, build, and run ASAN protocol fuzz in discovered VS environment
        shell: pwsh
        run: |
          Import-Module ./verify/core/Toolchain.psm1 -Force
          $toolchain = Find-VSToolchain
          if (-not $toolchain) { throw 'A VC-capable Visual Studio installation with bundled CMake/Ninja was not found.' }
          Enter-DevEnvironment -Toolchain $toolchain -Arch x64
          cmake --preset asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset asan --target ffprotocol_fuzz_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/asan -R ffprotocol_fuzz_tests --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
