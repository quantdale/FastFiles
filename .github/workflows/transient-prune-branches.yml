name: Transient branch prune

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Delete remaining obsolete remote branches
        shell: bash
        run: |
          set +e
          branches=(
            "plan/repo-local-addons-2026-08-28"
            "stabilization/ship-ready-2026-08-23"
            "cleanup/branch-prune-20260829"
          )
          failures=0
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            git push origin --delete "${branch}" || failures=$((failures+1))
          done
          exit "$failures"
